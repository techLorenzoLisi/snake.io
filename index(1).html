<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake.io — Gioca Online</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9522856157873401" crossorigin="anonymous"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0f;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column}
  header{text-align:center;padding:16px 8px 8px;background:#0a0a0f;border-bottom:1px solid #1a1a2e}
  header h1{font-family:'Press Start 2P',monospace;font-size:16px;color:#2ecc71;letter-spacing:2px}
  header p{font-size:11px;color:#666;margin-top:4px}
  .page{display:flex;gap:0;flex:1;justify-content:center;align-items:flex-start;padding:12px 8px}
  .ad-side{width:130px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;padding-top:4px}
  .ad-box{background:#111118;border:1px dashed #2a2a3e;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#444;font-size:10px;gap:4px;padding:8px}
  .ad-tall{height:280px}
  .ad-banner{width:100%;height:70px;flex-direction:row}
  .ad-label{font-size:9px;color:#333;text-transform:uppercase;letter-spacing:1px}
  main{flex:1;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 8px}
  .scorebar{display:flex;justify-content:space-between;align-items:center;width:100%;background:#111118;border:1px solid #1a1a2e;border-radius:10px;padding:8px 16px}
  .stat{text-align:center}
  .stat-label{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1px}
  .stat-value{font-family:'Press Start 2P',monospace;font-size:14px;color:#2ecc71;margin-top:2px}
  .diff-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
  select{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:6px;color:#aaa;padding:4px 8px;font-size:11px;cursor:pointer;outline:none}
  .canvas-wrap{position:relative;border-radius:12px;overflow:hidden;border:2px solid #1a1a2e;box-shadow:0 0 30px rgba(46,204,113,0.15)}
  canvas{display:block}
  .overlay{position:absolute;inset:0;background:rgba(10,10,15,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .overlay h2{font-family:'Press Start 2P',monospace;font-size:13px;color:#2ecc71}
  .overlay p{font-size:12px;color:#888}
  .overlay .score-big{font-family:'Press Start 2P',monospace;font-size:18px;color:#fff}
  .btn{font-family:'Press Start 2P',monospace;font-size:10px;padding:10px 20px;background:#2ecc71;color:#0a0a0f;border:none;border-radius:8px;cursor:pointer;transition:transform 0.1s,background 0.2s}
  .btn:hover{background:#27ae60;transform:scale(1.05)}
  .btn:active{transform:scale(0.97)}
  .controls{display:flex;gap:8px;align-items:center}
  .controls span{font-size:11px;color:#555}
  footer{text-align:center;padding:10px;font-size:10px;color:#333;border-top:1px solid #111}
  /* mobile d-pad */
  .dpad{display:none;flex-direction:column;align-items:center;gap:4px;margin-top:4px}
  .dpad-row{display:flex;gap:4px}
  .dpad button{width:44px;height:44px;background:#111118;border:1px solid #2a2a3e;border-radius:8px;color:#aaa;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .dpad button:active{background:#1a1a2e}
  @media(max-width:600px){
    .ad-side{display:none}
    .dpad{display:flex}
    header h1{font-size:12px}
  }
</style>
</head>
<body>
<header>
  <h1>🐍 SNAKE.IO</h1>
  <p>Usa le frecce — mangia il cibo — sopravvivi!</p>
</header>

<!-- TOP BANNER AD -->
<div style="display:flex;justify-content:center;padding:6px 0;background:#0a0a0f">
  <ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-9522856157873401"
     data-ad-slot="3872310329"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<div class="page">
  <!-- LEFT AD -->
  <div class="ad-side">
    <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-9522856157873401"
       data-ad-slot="3872310329"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <!-- GAME -->
  <main>
    <div class="scorebar">
      <div class="stat">
        <div class="stat-label">Punteggio</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div class="diff-wrap">
        <div class="stat-label">Velocità</div>
        <select id="diff">
          <option value="160">🐢 Lenta</option>
          <option value="100" selected>🐍 Normale</option>
          <option value="60">⚡ Veloce</option>
        </select>
      </div>
      <div class="stat">
        <div class="stat-label">Record</div>
        <div class="stat-value" id="best">0</div>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="c" width="360" height="320"></canvas>
      <div class="overlay" id="overlay">
        <h2>SNAKE.IO</h2>
        <p>Premi Start per giocare</p>
        <button class="btn" id="btn" onclick="startGame()">▶ START</button>
      </div>
    </div>

    <div class="controls">
      <span>⬆⬇⬅➡ frecce tastiera</span>
      <span>·</span>
      <span>swipe su mobile</span>
    </div>

    <!-- D-PAD mobile -->
    <div class="dpad" id="dpad">
      <div class="dpad-row"><button onclick="setDir(0,-1)">▲</button></div>
      <div class="dpad-row">
        <button onclick="setDir(-1,0)">◀</button>
        <button onclick="setDir(0,1)">▼</button>
        <button onclick="setDir(1,0)">▶</button>
      </div>
    </div>

    <!-- BOTTOM AD -->
    <ins class="adsbygoogle"
       style="display:block;margin-top:4px"
       data-ad-client="ca-pub-9522856157873401"
       data-ad-slot="3872310329"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </main>

  <!-- RIGHT AD -->
  <div class="ad-side">
    <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-9522856157873401"
       data-ad-slot="3872310329"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>
</div>

<footer>snake.io — gioco gratuito online · © 2025</footer>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=360,H=320,SZ=20;
const COLS=W/SZ,ROWS=H/SZ;
let snake,dir,nextDir,food,score,best=0,gameLoop,running=false;

function rnd(n){return Math.floor(Math.random()*n)}
function placeFood(){
  let p;
  do{p={x:rnd(COLS),y:rnd(ROWS)}}
  while(snake.some(s=>s.x===p.x&&s.y===p.y));
  food=p;
}
function initGame(){
  snake=[{x:9,y:8},{x:8,y:8},{x:7,y:8}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;
  document.getElementById('score').textContent='0';
  placeFood();
  draw();
}
function draw(){
  ctx.fillStyle='#0d0d14';
  ctx.fillRect(0,0,W,H);
  for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++){
    if((x+y)%2===0){ctx.fillStyle='#0f0f18';ctx.fillRect(x*SZ,y*SZ,SZ,SZ)}
  }
  // food glow
  ctx.shadowColor='#e74c3c';ctx.shadowBlur=10;
  ctx.fillStyle='#e74c3c';
  ctx.beginPath();ctx.arc(food.x*SZ+SZ/2,food.y*SZ+SZ/2,SZ/2-3,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  // snake
  snake.forEach((s,i)=>{
    if(i===0){ctx.shadowColor='#2ecc71';ctx.shadowBlur=8}
    ctx.fillStyle=i===0?'#2ecc71':i<4?'#27ae60':'#1e8449';
    ctx.beginPath();
    ctx.roundRect(s.x*SZ+1,s.y*SZ+1,SZ-2,SZ-2,i===0?5:3);
    ctx.fill();
    ctx.shadowBlur=0;
  });
  // eyes
  const h=snake[0];
  ctx.fillStyle='#0d0d14';
  const ex=dir.x===1?13:dir.x===-1?7:dir.y>0?8:12;
  const ey=dir.y===1?13:dir.y===-1?7:dir.x>0?8:12;
  ctx.beginPath();ctx.arc(h.x*SZ+ex,h.y*SZ+ey,2,0,Math.PI*2);ctx.fill();
  const ex2=dir.x===1?13:dir.x===-1?7:dir.y>0?12:8;
  const ey2=dir.y===1?8:dir.y===-1?12:dir.x>0?13:7;
  ctx.beginPath();ctx.arc(h.x*SZ+ex2,h.y*SZ+ey2,2,0,Math.PI*2);ctx.fill();
}
function step(){
  dir={...nextDir};
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){
    gameOver();return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10;
    document.getElementById('score').textContent=score;
    if(score>best){best=score;document.getElementById('best').textContent=best}
    placeFood();
  } else {snake.pop()}
  draw();
}
function startGame(){
  clearInterval(gameLoop);
  document.getElementById('overlay').style.display='none';
  running=true;
  initGame();
  const speed=parseInt(document.getElementById('diff').value);
  gameLoop=setInterval(step,speed);
}
function gameOver(){
  clearInterval(gameLoop);running=false;
  const ov=document.getElementById('overlay');
  ov.style.display='flex';
  ov.innerHTML=`<h2>GAME OVER</h2><div class="score-big">${score}</div><p>punti</p><button class="btn" onclick="startGame()">↩ RIPROVA</button>`;
}
function setDir(x,y){
  if(x!==0&&dir.x===0)nextDir={x,y};
  else if(y!==0&&dir.y===0)nextDir={x,y};
}
document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault()}
  if(!running&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){startGame();return}
  if(e.key==='ArrowUp'&&dir.y===0)nextDir={x:0,y:-1};
  else if(e.key==='ArrowDown'&&dir.y===0)nextDir={x:0,y:1};
  else if(e.key==='ArrowLeft'&&dir.x===0)nextDir={x:-1,y:0};
  else if(e.key==='ArrowRight'&&dir.x===0)nextDir={x:1,y:0};
});
let tx=null,ty=null;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!tx)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<8&&Math.abs(dy)<8){if(!running)startGame();return}
  if(Math.abs(dx)>Math.abs(dy)){setDir(dx>0?1:-1,0)}else{setDir(0,dy>0?1:-1)}
  tx=null;
},{passive:true});
initGame();
</script>
</body>
</html>
