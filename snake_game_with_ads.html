
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
#wrap{display:flex;gap:12px;padding:12px 0;align-items:flex-start;max-width:680px}
#left-ad{width:120px;flex-shrink:0}
#center{flex:1;display:flex;flex-direction:column;gap:8px;align-items:center}
#right-ad{width:120px;flex-shrink:0}
.ad-box{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;gap:4px;color:var(--color-text-tertiary);font-size:11px}
.ad-box i{font-size:24px;color:var(--color-text-tertiary)}
.ad-tall{height:300px}
.ad-banner{width:100%;height:60px;flex-direction:row;gap:8px}
#scorebar{display:flex;justify-content:space-between;align-items:center;width:100%}
#scorebar span{font-size:13px;color:var(--color-text-secondary)}
#scorebar strong{font-size:15px;font-weight:500;color:var(--color-text-primary)}
canvas{border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);display:block;background:#fff}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
#msg h2{font-size:18px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px}
#msg p{font-size:13px;color:var(--color-text-secondary)}
#canvas-wrap{position:relative}
#btn{font-size:13px;padding:6px 20px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);cursor:pointer}
#btn:hover{background:var(--color-background-secondary)}
#diff-row{display:flex;gap:8px;align-items:center}
#diff-row label{font-size:12px;color:var(--color-text-secondary)}
select{font-size:12px;border:0.5px solid var(--color-border-secondary);border-radius:6px;background:var(--color-background-primary);color:var(--color-text-primary);padding:4px 8px}
</style>
<h2 class="sr-only">Snake — gioco browser con spazio per annunci pubblicitari</h2>
<div id="wrap">
  <div id="left-ad">
    <div class="ad-box ad-tall">
      <i class="ti ti-ad-2" aria-hidden="true"></i>
      <span>Annuncio<br>120×300</span>
      <span style="font-size:10px;margin-top:4px">AdSense / banner laterale</span>
    </div>
  </div>
  <div id="center">
    <div id="scorebar">
      <div><span>Punteggio </span><strong id="score">0</strong></div>
      <div id="diff-row">
        <label for="diff">Velocità</label>
        <select id="diff">
          <option value="150">Lenta</option>
          <option value="100" selected>Normale</option>
          <option value="65">Veloce</option>
        </select>
      </div>
      <div><span>Record </span><strong id="best">0</strong></div>
    </div>
    <div id="canvas-wrap">
      <canvas id="c" width="340" height="300"></canvas>
      <div id="msg">
        <h2>🐍 Snake</h2>
        <p>Premi <strong>Avvia</strong> o usa le frecce</p>
      </div>
    </div>
    <button id="btn">▶ Avvia</button>
    <div class="ad-box ad-banner" style="width:340px">
      <i class="ti ti-ad" aria-hidden="true"></i>
      <span>Annuncio banner 728×90 — AdSense leaderboard</span>
    </div>
  </div>
  <div id="right-ad">
    <div class="ad-box ad-tall">
      <i class="ti ti-ad-2" aria-hidden="true"></i>
      <span>Annuncio<br>120×300</span>
      <span style="font-size:10px;margin-top:4px">AdSense / banner laterale</span>
    </div>
  </div>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=340,H=300,SZ=20;
const COLS=W/SZ,ROWS=H/SZ;
let snake,dir,nextDir,food,score,best=0,loop,running=false,started=false;
const scoreEl=document.getElementById('score');
const bestEl=document.getElementById('best');
const msgEl=document.getElementById('msg');
const btn=document.getElementById('btn');
const diffEl=document.getElementById('diff');

function rnd(n){return Math.floor(Math.random()*n)}
function placeFood(){
  let pos;
  do{pos={x:rnd(COLS),y:rnd(ROWS)}}
  while(snake.some(s=>s.x===pos.x&&s.y===pos.y));
  food=pos;
}
function init(){
  snake=[{x:8,y:7},{x:7,y:7},{x:6,y:7}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;scoreEl.textContent=0;
  placeFood();draw();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#f8f9fa';
  ctx.fillRect(0,0,W,H);
  for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++){
    if((x+y)%2===0){ctx.fillStyle='#f0f0f0';ctx.fillRect(x*SZ,y*SZ,SZ,SZ)}
  }
  ctx.fillStyle='#e74c3c';
  ctx.beginPath();ctx.arc(food.x*SZ+SZ/2,food.y*SZ+SZ/2,SZ/2-2,0,Math.PI*2);ctx.fill();
  snake.forEach((s,i)=>{
    const g=i===0?'#2ecc71':'#27ae60';
    ctx.fillStyle=g;
    ctx.beginPath();
    const r=i===0?5:4;
    ctx.roundRect(s.x*SZ+1,s.y*SZ+1,SZ-2,SZ-2,r);
    ctx.fill();
  });
  if(snake.length>0&&snake[0]){
    ctx.fillStyle='#fff';
    const h=snake[0];
    const ex=dir.x===1?12:dir.x===-1?6:dir.y===1?8:10;
    const ey=dir.y===1?12:dir.y===-1?6:dir.x===1?8:10;
    const ex2=dir.x===1?12:dir.x===-1?6:dir.y===1?12:8;
    const ey2=dir.y===1?8:dir.y===-1?12:dir.x===1?12:8;
    ctx.beginPath();ctx.arc(h.x*SZ+ex,h.y*SZ+ey,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(h.x*SZ+ex2,h.y*SZ+ey2,2,0,Math.PI*2);ctx.fill();
  }
}
function step(){
  dir={...nextDir};
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){
    gameOver();return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10;scoreEl.textContent=score;
    if(score>best){best=score;bestEl.textContent=best}
    placeFood();
  } else {snake.pop()}
  draw();
}
function gameOver(){
  clearInterval(loop);running=false;
  msgEl.innerHTML='<h2>Game Over!</h2><p>Punteggio: <strong>'+score+'</strong></p>';
  msgEl.style.display='block';
  btn.textContent='↩ Riprova';
}
function start(){
  clearInterval(loop);
  msgEl.style.display='none';
  init();running=true;started=true;
  loop=setInterval(step,parseInt(diffEl.value));
  btn.textContent='↩ Ricomincia';
}
btn.onclick=start;
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)){e.preventDefault()}
  if(!running&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)){start();return}
  if(k==='ArrowUp'&&dir.y===0)nextDir={x:0,y:-1};
  else if(k==='ArrowDown'&&dir.y===0)nextDir={x:0,y:1};
  else if(k==='ArrowLeft'&&dir.x===0)nextDir={x:-1,y:0};
  else if(k==='ArrowRight'&&dir.x===0)nextDir={x:1,y:0};
});
canvas.addEventListener('click',()=>{if(!running)start()});
let ts=null,tx=null,ty=null;
canvas.addEventListener('touchstart',e=>{ts=e.touches[0];tx=ts.clientX;ty=ts.clientY},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!tx)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<10&&Math.abs(dy)<10){if(!running)start();return}
  if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&dir.x===0)nextDir={x:1,y:0};else if(dx<0&&dir.x===0)nextDir={x:-1,y:0}}
  else{if(dy>0&&dir.y===0)nextDir={x:0,y:1};else if(dy<0&&dir.y===0)nextDir={x:0,y:-1}}
  tx=null;
},{passive:true});
init();
</script>
